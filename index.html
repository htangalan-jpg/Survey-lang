<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="letter">
                <h1>For You 💌</h1>
                <p>There is something I want to tell you...</p>
                <button onclick="openLetter()">Open Letter</button>
            </div>
        </div>

        <div class="confession" id="confession">
            <h1>Dear You,</h1>

            <p>
                I've been wanting to say this for a while.
                I really like you, and I wanted to be honest
                about how I feel.
            </p>

            <p>
                I don't expect anything from you.
                I simply wanted you to know.
            </p>

            <h2>I like you. ❤️</h2>

            <button onclick="showAnswer()">💗</button>

            <p id="answer"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
